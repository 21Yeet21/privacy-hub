<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Privacy Hub Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header">
        <div class="header-left">
            <h1>Privacy Hub</h1>
            <p>Per-device policy routing & zero-trust infrastructure</p>
        </div>
        <div class="header-right">
            <button id="refreshSystemBtn" class="action-btn">Refresh System</button>
            <button id="newIdentityBtn" class="action-btn danger">New Identity</button>
            <a href="/logout" class="action-btn">Logout</a>
        </div>
    </div>

    <div class="main">
        <section class="panel add-device-panel">
            <h2>+ Add New Device</h2>
            <form id="addDeviceForm">
                <input type="text" id="deviceName" placeholder="Device Name (e.g., My iPhone)" required>
                <input type="text" id="deviceIP" placeholder="WireGuard IP (e.g., 10.8.0.2)" required pattern="10\.8\.0\.[0-9]+">
                <button type="submit" class="add-btn">Add</button>
            </form>
        </section>

        <section class="panel devices-panel">
            <h2>// Connected Devices</h2>
            <div id="devicesContainer" class="device-grid">
                <!-- Device cards will be injected here by app.js -->
            </div>
        </section>
        
        <div id="status" class="status">Initializing...</div>
    </div>

    <footer class="footer">
        created by yeet
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
